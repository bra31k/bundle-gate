name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC), no token needed

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Ensure npm supports trusted publishing
        run: |
          current="$(npm --version)"
          minimum="11.5.1"
          if [ "$(printf '%s\n' "$minimum" "$current" | sort -V | head -n1)" != "$minimum" ]; then
            npm install --global "npm@^$minimum"
          fi
          npm --version
      - run: npm ci
      - run: npm test
      - name: Check release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match package.json version 'v$version'."
            exit 1
          fi
      - run: npm publish
