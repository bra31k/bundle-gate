# bundle-gate GitHub Action
#
# Compares the eager client JS/CSS size of every Next.js route between a pull
# request and its base, and fails when a route breaches its limit.
#
# Usage (needs Next.js 16.4+; Node and npm must already be on the runner):
#
#   on: pull_request
#   permissions:
#     contents: read
#   jobs:
#     bundle-gate:
#       runs-on: ubuntu-latest
#       steps:
#         - uses: actions/checkout@<sha>   # default ref = the PR merge commit
#           with:
#             fetch-depth: 2               # the merge commit plus both parents
#         - uses: actions/setup-node@<sha>
#           with:
#             node-version: 24
#         - uses: <owner>/bundle-gate@<sha>
#           with:
#             working-directory: apps/web  # optional, default "."
#             config: bundle-gate.config.json  # optional
#
# head = the checked-out merge commit, base = its first parent. If HEAD is not
# a merge commit (or the parent is unavailable) the action warns in the job
# summary and succeeds without running anything else. A base that cannot be
# analyzed (install fails, Next older than 16.4, base does not build, first PR
# that adds bundle-gate) is skipped the same way, with a warning. Only a head
# failure or a tool error in `diff` fails the action.
#
# Files that exist only in the head checkout (untracked or generated by earlier
# workflow steps, e.g. .env.production) are not present in the base worktree;
# use the `prepare` input to generate them for both sides.
#
# `config` is resolved against the step's working directory (the workspace),
# not against `working-directory`. Empty: uses bundle-gate.config.json in the
# workspace root if it exists, otherwise the default rule.
#
# A custom Next distDir (anything other than .next) must be given via `dist-dir`.

name: bundle-gate
description: Gate Next.js route bundle size by comparing a pull request with its base.

inputs:
  working-directory:
    description: Directory of the Next.js app, relative to the workspace or absolute.
    required: false
    default: "."
  config:
    description: Path to a bundle-gate config file. Empty uses bundle-gate.config.json in the workspace root if it exists, otherwise the default rule.
    required: false
    default: ""
  prepare:
    description: Command to run before each snapshot (passed to `bundle-gate snapshot --prepare`).
    required: false
    default: ""
  dist-dir:
    description: Next distDir of the app, relative to the app directory, when it is not .next (passed to `bundle-gate snapshot --dist-dir`).
    required: false
    default: ""
  install-command:
    description: Command that installs dependencies, run in the app directory of both sides. Empty skips the install.
    required: false
    default: "npm ci"
  package:
    description: npm spec of the bundle-gate package to install (a name, a version or a tarball path).
    required: false
    default: "bundle-gate"
  fail-on-breach:
    description: Fail the action when a route breaches its limit ("true" or "false"). Tool errors always fail it.
    required: false
    default: "true"

outputs:
  breached:
    description: '"true" when at least one route breached its limit, otherwise "false".'
    value: ${{ steps.diff.outputs.breached || 'false' }}
  exit-code:
    description: Exit code of `bundle-gate diff` (0 pass or skip, 1 breach, 2 tool error).
    value: ${{ steps.diff.outputs.exit-code || '0' }}

runs:
  using: composite
  steps:
    - name: Resolve base and head
      id: refs
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        skip() {
          echo "::warning::bundle-gate: no base commit, skipping ($1)"
          {
            echo "### bundle-gate"
            echo
            echo "Warning: no base commit, skipping ($1)."
            echo "Check out the pull request merge commit with \`actions/checkout\` (default settings) and \`fetch-depth: 2\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        }

        root="$(git -C "$WORKING_DIRECTORY" rev-parse --show-toplevel)"
        prefix="$(git -C "$WORKING_DIRECTORY" rev-parse --show-prefix)"
        app_rel="${prefix%/}"

        parent_count() {
          local line
          line="$(git -C "$root" rev-list --parents -n 1 HEAD)"
          set -- $line
          echo $(($# - 1))
        }

        # In a shallow checkout the parents of the merge commit may be missing,
        # which makes HEAD look like it has fewer parents than it has.
        count="$(parent_count)"
        if [ "$count" -lt 2 ] && [ "$(git -C "$root" rev-parse --is-shallow-repository)" = "true" ]; then
          echo "Shallow checkout, fetching the parents of HEAD"
          git -C "$root" fetch --no-tags --deepen=1 origin || echo "fetch failed, continuing"
          count="$(parent_count)"
        fi

        if [ "$count" -lt 2 ]; then
          skip "HEAD is not a merge commit"
        fi

        head_sha="$(git -C "$root" rev-parse HEAD)"
        if ! base_sha="$(git -C "$root" rev-parse --verify --quiet 'HEAD^1^{commit}')"; then
          skip "first parent of HEAD is not available"
        fi

        base_root="$RUNNER_TEMP/bundle-gate-base"
        if [ -n "$app_rel" ]; then
          head_app="$root/$app_rel"
          base_app="$base_root/$app_rel"
        else
          head_app="$root"
          base_app="$base_root"
        fi

        {
          echo "skip=false"
          echo "head-sha=$head_sha"
          echo "base-sha=$base_sha"
          echo "root=$root"
          echo "base-root=$base_root"
          echo "head-app=$head_app"
          echo "base-app=$base_app"
        } >> "$GITHUB_OUTPUT"
        echo "head: $head_sha"
        echo "base: $base_sha"
        echo "app:  ${app_rel:-.}"

    - name: Install bundle-gate
      if: steps.refs.outputs.skip != 'true'
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
      run: |
        set -euo pipefail
        npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/bundle-gate-cli" "$PACKAGE"
        test -x "$RUNNER_TEMP/bundle-gate-cli/node_modules/.bin/bundle-gate"

    - name: Snapshot base
      id: base
      if: steps.refs.outputs.skip != 'true'
      shell: bash
      env:
        ROOT: ${{ steps.refs.outputs.root }}
        BASE_ROOT: ${{ steps.refs.outputs.base-root }}
        BASE_SHA: ${{ steps.refs.outputs.base-sha }}
        BASE_APP: ${{ steps.refs.outputs.base-app }}
        INSTALL_COMMAND: ${{ inputs.install-command }}
        PREPARE: ${{ inputs.prepare }}
        DIST_DIR: ${{ inputs.dist-dir }}
      run: |
        # A base that cannot be analyzed is a neutral skip, never a failure.
        snapshot_base() {
          set -euo pipefail
          git -C "$ROOT" worktree add --detach "$BASE_ROOT" "$BASE_SHA"

          if [ -n "$INSTALL_COMMAND" ]; then
            (cd "$BASE_APP" && bash -euo pipefail -c "$INSTALL_COMMAND")
          fi

          local args=(snapshot --dir "$BASE_APP" --name base --out "$RUNNER_TEMP/base.json.gz")
          if [ -n "$PREPARE" ]; then
            args+=(--prepare "$PREPARE")
          fi
          if [ -n "$DIST_DIR" ]; then
            args+=(--dist-dir "$DIST_DIR")
          fi
          "$RUNNER_TEMP/bundle-gate-cli/node_modules/.bin/bundle-gate" "${args[@]}"
          local dist_dir="$DIST_DIR"
          test -d "$BASE_APP/${dist_dir:-.next}/diagnostics/analyze"
        }

        set +e
        (snapshot_base)
        code=$?
        set -e

        if [ "$code" -eq 0 ]; then
          echo "base-ok=true" >> "$GITHUB_OUTPUT"
        else
          reason="base setup, install or snapshot failed with exit code $code"
          echo "::warning::bundle-gate: base could not be analyzed, skipping: $reason"
          {
            echo "### bundle-gate"
            echo
            echo "Warning: base could not be analyzed, skipping: $reason."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "base-ok=false" >> "$GITHUB_OUTPUT"
        fi
        exit 0

    - name: Snapshot head
      if: steps.refs.outputs.skip != 'true' && steps.base.outputs.base-ok == 'true'
      shell: bash
      env:
        HEAD_APP: ${{ steps.refs.outputs.head-app }}
        BASE_APP: ${{ steps.refs.outputs.base-app }}
        INSTALL_COMMAND: ${{ inputs.install-command }}
        PREPARE: ${{ inputs.prepare }}
        DIST_DIR: ${{ inputs.dist-dir }}
      run: |
        set -euo pipefail

        if [ -n "$INSTALL_COMMAND" ]; then
          (cd "$HEAD_APP" && bash -euo pipefail -c "$INSTALL_COMMAND")
        fi

        # Carry the base analyzer folder over so that Next appends `head` to
        # its own history.json. bundle-gate never edits that file.
        dist_dir="$DIST_DIR"
        analyze="${dist_dir:-.next}/diagnostics/analyze"
        if [ ! -d "$BASE_APP/$analyze" ]; then
          echo "::error::bundle-gate: base analyzer folder not found at $BASE_APP/$analyze"
          exit 1
        fi
        mkdir -p "$HEAD_APP/$(dirname "$analyze")"
        rm -rf "$HEAD_APP/$analyze"
        cp -R "$BASE_APP/$analyze" "$HEAD_APP/$analyze"

        args=(snapshot --dir "$HEAD_APP" --name head --out "$RUNNER_TEMP/head.json.gz")
        if [ -n "$PREPARE" ]; then
          args+=(--prepare "$PREPARE")
        fi
        if [ -n "$DIST_DIR" ]; then
          args+=(--dist-dir "$DIST_DIR")
        fi
        "$RUNNER_TEMP/bundle-gate-cli/node_modules/.bin/bundle-gate" "${args[@]}"

    - name: Compare snapshots
      id: diff
      if: steps.refs.outputs.skip != 'true' && steps.base.outputs.base-ok == 'true'
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        FAIL_ON_BREACH: ${{ inputs.fail-on-breach }}
      run: |
        set -euo pipefail
        report="$RUNNER_TEMP/bundle-gate.md"
        rm -f "$report"

        args=(diff "$RUNNER_TEMP/base.json.gz" "$RUNNER_TEMP/head.json.gz" --format markdown --output "$report")
        if [ -n "$CONFIG" ]; then
          args+=(--config "$CONFIG")
        fi
        # A breach that does not fail the action is annotated as a warning, not an error.
        if [ "$FAIL_ON_BREACH" != "true" ]; then
          args+=(--annotations warning)
        fi

        set +e
        "$RUNNER_TEMP/bundle-gate-cli/node_modules/.bin/bundle-gate" "${args[@]}"
        code=$?
        set -e

        if [ -f "$report" ]; then
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
        else
          {
            echo "### bundle-gate"
            echo
            echo "No report was written (exit code $code)."
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ "$code" -eq 1 ]; then
          echo "breached=true" >> "$GITHUB_OUTPUT"
        else
          echo "breached=false" >> "$GITHUB_OUTPUT"
        fi
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "bundle-gate diff exited with $code"

    - name: Upload analyzer report
      if: steps.refs.outputs.skip != 'true' && steps.base.outputs.base-ok == 'true' && steps.diff.outputs.breached == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: bundle-gate-analyzer-report
        path: ${{ steps.refs.outputs.head-app }}/${{ inputs.dist-dir || '.next' }}/diagnostics/analyze
        if-no-files-found: warn
        include-hidden-files: true

    - name: Apply result
      if: steps.refs.outputs.skip != 'true' && steps.base.outputs.base-ok == 'true'
      shell: bash
      env:
        EXIT_CODE: ${{ steps.diff.outputs.exit-code }}
        FAIL_ON_BREACH: ${{ inputs.fail-on-breach }}
      run: |
        set -euo pipefail
        case "$EXIT_CODE" in
          0)
            echo "bundle-gate: no route breached its limit"
            ;;
          1)
            if [ "$FAIL_ON_BREACH" = "true" ]; then
              echo "::error::bundle-gate: at least one route breached its limit"
              exit 1
            fi
            echo "::warning::bundle-gate: at least one route breached its limit (fail-on-breach is not true)"
            ;;
          *)
            echo "::error::bundle-gate: tool error (diff exit code ${EXIT_CODE:-unknown})"
            exit 1
            ;;
        esac

    - name: Remove base worktree
      if: always()
      shell: bash
      env:
        ROOT: ${{ steps.refs.outputs.root }}
        BASE_ROOT: ${{ steps.refs.outputs.base-root }}
      run: |
        if [ -n "$ROOT" ] && [ -n "$BASE_ROOT" ]; then
          git -C "$ROOT" worktree remove --force "$BASE_ROOT" || true
          git -C "$ROOT" worktree prune || true
        fi
        exit 0
